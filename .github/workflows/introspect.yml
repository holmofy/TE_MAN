name: TE_MAN node introspection

# 用途：在 Windows x64 + Python 3.13 + ComfyUI 环境里把 TE_MAN 的 pyd 真正
# import 起来，导出每个节点的 INPUT_TYPES / RETURN_TYPES / 默认值等精确规格，
# 用于回填 spec/*.md 里的"未确认"项。产物在 Actions 的 Artifacts 里下载：
#   te-man-introspection → te_man_introspection.json

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.pyd"
      - "scripts/introspect_te_man.py"
      - ".github/workflows/introspect.yml"

jobs:
  introspect:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Clone ComfyUI
        shell: pwsh
        run: git clone --depth 1 https://github.com/comfyanonymous/ComfyUI "$env:RUNNER_TEMP\ComfyUI"

      - name: Install ComfyUI dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r "$env:RUNNER_TEMP\ComfyUI\requirements.txt"
          pip install requests

      - name: Install TE_MAN as custom node
        # robocopy 退出码 0-7 都算成功
        shell: cmd
        run: |
          robocopy "%GITHUB_WORKSPACE%" "%RUNNER_TEMP%\ComfyUI\custom_nodes\TE_MAN" /E /XD .git .github __pycache__ spec
          if %ERRORLEVEL% LEQ 7 exit /b 0
          exit /b %ERRORLEVEL%

      - name: Run introspection
        shell: pwsh
        env:
          COMFYUI_DIR: ${{ runner.temp }}\ComfyUI
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/introspect_te_man.py --out "$env:GITHUB_WORKSPACE\te_man_introspection.json"
          Write-Host "----- JSON 头部预览 -----"
          Get-Content "$env:GITHUB_WORKSPACE\te_man_introspection.json" -TotalCount 60

      - name: Commit introspection result to repo
        if: success()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          New-Item -ItemType Directory -Force spec/_introspection | Out-Null
          Copy-Item te_man_introspection.json spec/_introspection/te_man_introspection.json -Force
          git add spec/_introspection/te_man_introspection.json
          git commit -m "introspection result (run $env:GITHUB_RUN_ID)" --no-verify
          git push

      - name: Upload introspection JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: te-man-introspection
          path: te_man_introspection.json
          if-no-files-found: warn
